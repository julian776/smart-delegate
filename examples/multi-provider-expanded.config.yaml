review:
  enabled: true
  description: |-
    Require an independent reader for each change and review the final revision after corrections.
    Use Focused Reader DeepSeek for small MiniMax changes. For DeepSeek implementation use
    Claude Sonnet Reader, escalating to Codex Sol/Opus only for substantive complexity or unresolved
    findings. Never use the implementing worker as its reviewer. Report evidence-backed findings
    and revision reviewed; no edits by reviewer. Route through the selected reader invocation.
qa:
  enabled: true
  description: |-
    Use Fast Reader MiniMax for known non-mutating check commands; use Focused Reader DeepSeek
    for behavioral interpretation. If a check writes build artifacts, assign a writer in an isolated
    worktree instead. Verify acceptance criteria and integration on the final revision. Record actual
    CI run, revision, terminal status and relevant logs when CI is requested. Pending, inaccessible,
    or failing CI is not ready. Corrections go back to the writer; rerun affected checks.
