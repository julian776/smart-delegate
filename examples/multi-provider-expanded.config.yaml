      opencode run --agent plan --model opencode/deepseek-v4-pro
    Run in the background with a 15-minute timeout; retain stdout, stderr, and session ID.
    Inspect and report only; do not edit project files or run mutating commands. Plan mode is not an OS sandbox.
    Do not spawn followers, merge, push, deploy, or change permissions. Preserve existing permission
    controls; if unattended permissions block execution, report the blocker. Return status,
    revision/artifacts, checks and evidence, and unresolved issues. On failure record diagnostics
    and fallback reason before selecting the next suitable configured profile.
- title: Deep Reader — Claude Sonnet
  priority: 40
  description: Use for difficult analysis or independent review requiring a different family from DeepSeek,
    or when DeepSeek Pro is unavailable or insufficient. Read only. Do not choose merely because Claude
    is the host.
  invocation: |-
    Run from the assigned project root or isolated worktree. Pass the complete assignment on stdin:
      claude -p --model claude-sonnet-5-5 --permission-mode plan --output-format json
    Use the external CLI even when the host is a different provider. Run in the background with
    a 20-minute timeout. Retain stdout and stderr and the session/process handle.
    Read and report only; do not modify project files or run mutating commands.
    No recursive delegation, merge, push, deployment, permission bypass, or scope expansion.
    For Claude, plan mode is an agent policy, not an OS sandbox; acceptEdits does not authorize
    arbitrary shell commands. If permissions block unattended execution, report the blocker.
    Return status, revision/artifacts, check results/evidence, and unresolved issues. Record the
    reason before falling back to another configured profile; never silently change models.
- title: Advanced Reader — Codex Sol
  priority: 50
  description: Use for complex cross-cutting reasoning, adjudication, or independent review, especially
    after cheaper capable routes fail. Read only. Avoid routine work.
  invocation: |-
    Run from the assigned project root or isolated worktree. Pass the complete assignment on stdin:
      codex exec -m gpt-6.1-sol -s read-only --ephemeral -
    Use the external CLI even when the host is a different provider. Run in the background with
