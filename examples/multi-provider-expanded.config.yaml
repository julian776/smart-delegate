# Expanded multi-provider example with 14 explicit reader/writer profiles.
# Derived from a personal workflow; concrete model IDs researched 2026-11-15.
# Not loaded automatically and not validated with live cross-provider calls.
# Copy to ~/.config/smart-delegate/config.yaml after checking model access.
# A project .smart-delegate/config.yaml overrides this entire personal configuration.
# OpenCode Console (pay as you go) is assumed; Go/direct providers have different IDs/billing.
# Prerequisites on every computer: authenticated opencode, claude, and codex CLIs.
# Confirm current models and CLI flags; dated IDs may need updating for your accounts.
# Roles and tiers use existing description fields, not new parser fields or sandbox guarantees.
# Reader = no project edits; Writer = assigned files plus checks. Choose role before tier.
# Route small mechanical tasks to MiniMax, routine tasks to DeepSeek, and escalate on ambiguity,
# risk, or demonstrated capability failure. Priorities break ties among suitable profiles.
# Do not call every provider per task. Batch size/concurrency come from Coordinator.
# Setup and comparison with the compact example: ../README.md#examples-multiple-providers
models:
- title: Fast Reader — MiniMax
  priority: 10
  description: Use only for small, mechanical, low-risk lookups, extraction, and command-result summaries.
    Single clear outcome and easy verification. No project edits. For diagnosis, interpretation, or multi-file
    implementation use Focused instead.
  invocation: |-
    Run from the assigned project root or isolated worktree. Inspect `opencode run --help`
    and `opencode models` once per run; confirm the exact provider/model ID is available.
    The proposed Console route is opencode/minimax-m3; do not silently substitute Go or another
    billing provider. If using Go, explicitly select and record the ID shown by that installation.
    Pass the full assignment via stdin to:
      opencode run --agent plan --model opencode/minimax-m3
    Run in the background with a 15-minute timeout; retain stdout, stderr, and session ID.
    Inspect and report only; do not edit project files or run mutating commands. Plan mode is not an OS sandbox.
    Do not spawn followers, merge, push, deploy, or change permissions. Preserve existing permission
    controls; if unattended permissions block execution, report the blocker. Return status,
    revision/artifacts, checks and evidence, and unresolved issues. On failure record diagnostics
    and fallback reason before selecting the next suitable configured profile.
- title: Focused Reader — DeepSeek
  priority: 20
  description: Default for routine code investigation, tracing behavior, diagnosis, and routine review.
    Read only. Excludes architecture decisions, security-sensitive changes, and unresolved cross-system
    ambiguity.
  invocation: |-
    Run from the assigned project root or isolated worktree. Inspect `opencode run --help`
    and `opencode models` once per run; confirm the exact provider/model ID is available.
    The proposed Console route is opencode/deepseek-v4.1-flash; do not silently substitute Go or another
    billing provider. If using Go, explicitly select and record the ID shown by that installation.
    Pass the full assignment via stdin to:
      opencode run --agent plan --model opencode/deepseek-v4.1-flash
    Run in the background with a 15-minute timeout; retain stdout, stderr, and session ID.
    Inspect and report only; do not edit project files or run mutating commands. Plan mode is not an OS sandbox.
    Do not spawn followers, merge, push, deploy, or change permissions. Preserve existing permission
    controls; if unattended permissions block execution, report the blocker. Return status,
    revision/artifacts, checks and evidence, and unresolved issues. On failure record diagnostics
    and fallback reason before selecting the next suitable configured profile.
- title: Deep Reader — DeepSeek Pro
  priority: 30
  description: Use for difficult investigation or review with clear scope but substantial reasoning, or
    a capability failure from Focused. Read only. For an independent cross-provider opinion or unresolved
    design risk use Claude/Codex.
  invocation: |-
    Run from the assigned project root or isolated worktree. Inspect `opencode run --help`
    and `opencode models` once per run; confirm the exact provider/model ID is available.
    The proposed Console route is opencode/deepseek-v4-pro; do not silently substitute Go or another
    billing provider. If using Go, explicitly select and record the ID shown by that installation.
