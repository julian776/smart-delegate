- title: Deep Reader (Codex)
  priority: 30
  description: 'Reader: difficult, ambiguous, or cross-cutting analysis, planning, and independent review.
    Inspect and report only; no project edits or mutating commands.'
  invocation: |-
    Run from the assigned project root or isolated worktree. Pass the complete assignment on stdin:
      codex exec -m <codex-model> -s read-only --ephemeral -
    Confirm model access in Codex; omit -m only when intentionally using its configured default.
    Run in the background with a time limit and retain stdout, stderr, and process handle.
    Inspect and report only.
    Do not bypass sandbox/approvals or spawn workers. Record diagnostics and the reason
    before falling back to the next suitable profile.

    Append the following report contract to the assignment so the delegate returns a
    small, complete report:

    REPORT FORMAT (mandatory): Answer in caveman voice — answer first, cut ceremony,
    drop articles where meaning survives, keep every technical fact. Code, commands,
