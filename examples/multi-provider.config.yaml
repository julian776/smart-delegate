- title: Deep fallback Reader (Claude)
  priority: 35
  description: 'Reader: difficult, ambiguous, or cross-cutting analysis, planning, and independent review.
    Inspect and report only; no project edits or mutating commands. Use a native Claude worker when available;
    this is a fallback, not a host preference. Append the report contract to the assignment so the
    delegate returns a small, complete report; see the Report contract section in the smart-delegate SKILL.md.'
  model:
  - Sonnet
- title: Deep fallback Writer (Claude)
  priority: 35
  description: 'Writer: difficult, ambiguous, or cross-cutting implementation and debugging. May edit
    only assigned paths and run relevant checks. Use a native Claude worker when available; this is a
    fallback, not a host preference. Append the report contract to the assignment so the delegate
    returns a small, complete report; see the Report contract section in the smart-delegate SKILL.md.'
  model:
  - Sonnet
review:
  enabled: true
  description: |-
    Review each change independently at its final revision. Use an appropriate Reader profile:
    Focused DeepSeek for small MiniMax edits, Deep Codex or Claude fallback for substantive
    DeepSeek changes. Never review your own implementation. Return prioritized findings
    with file references and evidence, or explicitly report no findings. Do not edit files.
    Select and follow the reader's invocation rather than forcing every review to one provider.
qa:
  enabled: true
  description: |-
    Verify acceptance criteria and relevant integration behavior at the final revision.
    Use a Fast Reader for known non-mutating checks, Focused Reader for interpretation,
    or an isolated Writer when checks create build artifacts. Return commands, results,
    and evidence. Route fixes back to the assigned writer. When CI is requested, record
    its run and revision and wait for its terminal result; pending or unavailable is not green.
