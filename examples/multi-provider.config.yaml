# Multi-provider reader/writer example; not loaded automatically.
# Copy to .smart-delegate/config.yaml or ~/.config/smart-delegate/config.yaml.
# A selected config replaces the bundled defaults entirely (no merging).
#
# Replace placeholders with accessible model IDs. Suggested starting points:
# MiniMax M3 for small mechanical tasks; DeepSeek V4.1 Flash for routine work;
# GPT-6.1 Sol for complex work. Confirm IDs and access with each provider.
# OpenCode Go examples: opencode-go/minimax-m3 and opencode-go/deepseek-v4.1-flash.
# Console and direct-provider routes differ; never silently change billing providers.
# Prerequisites: authenticated opencode and codex CLIs; native Claude workers for fallback.
#
# Choose Reader or Writer FIRST, then the lowest capable tier. Priority breaks ties
# among suitable profiles. Reader/Writer are description guidance using the existing
# schema, not new scheduler fields or an enforced filesystem boundary.
# Independent review uses a different worker; prefer another family for substantive changes.
# Do not call every provider on each task. All workers obey the owner's scope and batch limits.
# Invocations are examples, not a claim of live cross-provider testing.
models:
- title: Fast Reader (OpenCode MiniMax)
  priority: 10
  description: 'Reader: small exact lookups, extraction, and command-result summaries. Inspect and report
    only; no project edits or mutating commands.'
  invocation: |-
    Run from the assigned project root or isolated worktree. Confirm the configured
    provider/model with `opencode models` and inspect `opencode run --help` before first use.
    Pass the complete assignment on stdin:
      opencode run --agent plan --model <minimax-provider/model>
    Use an installed, authenticated provider route; Console, Go, and direct-provider IDs
    and billing differ. Plan supports investigation; it is an agent policy, not an OS sandbox.
    Run in the background with a time limit. Retain stdout, stderr, and session handle.
    Do not use --auto or bypass permissions. Report permission blockers and failures;
    record the reason before selecting the next suitable profile. Do not spawn workers.

    Append the following report contract to the assignment so the delegate returns a
    small, complete report:

    REPORT FORMAT (mandatory): Answer in caveman voice — answer first, cut ceremony,
    drop articles where meaning survives, keep every technical fact. Code, commands,
    paths, numbers, and exact error strings stay verbatim. No greeting, no recap,
    no closer, no "Status: done" padding.
    Completeness floor: terseness never removes a required fact. If the task asked for
    every item, a complete enumeration, or an exact value, give every one of them.
    Report only what the assignment asked for: findings, evidence, and any blocker.

- title: Fast Writer (OpenCode MiniMax)
  priority: 10
  description: 'Writer: small mechanical edits from a decided plan, with easy verification. May edit only
    assigned paths and run relevant checks.'
  invocation: |-
    Run from the assigned project root or isolated worktree. Confirm the configured
    provider/model with `opencode models` and inspect `opencode run --help` before first use.
    Pass the complete assignment on stdin:
      opencode run --agent build --model <minimax-provider/model>
    Use an installed, authenticated provider route; Console, Go, and direct-provider IDs
    and billing differ. Build permits edits; limit them to assigned paths.
    Run in the background with a time limit. Retain stdout, stderr, and session handle.
    Do not use --auto or bypass permissions. Report permission blockers and failures;
    record the reason before selecting the next suitable profile. Do not spawn workers.

