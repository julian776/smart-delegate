# Bundled defaults, used when neither .smart-delegate/config.yaml nor
# ~/.config/smart-delegate/config.yaml exists. Every field is optional. Copy this file to either
# location to customize it; the first file found replaces these defaults entirely (no merging).
#
# `model` accepts one name or a list in preference order. The first name available in the current
# environment is used; if none is available, the host's default model is used instead.
# Lower `priority` is preferred between equally suitable tiers, but quality wins: when a task sits
# between two tiers, choose the stronger one.
#
# The Fast tier prefers the optional OpenCode CLI route when it is installed and the free model is
# available. The native Fast profile is the portable fallback. Creating a configuration file
# replaces both profiles instead of adding to them.
models:
  - title: Fast OpenCode
    priority: 10
    description: >
      Use for simple, low-risk work with a single verifiable answer and little judgment: locating
      files, finding where a symbol is defined, exact searches, listing usages, installing or
      downloading dependencies, running a build, test, or other command, extracting or reformatting
      data, summarizing a small input, and repetitive boilerplate. This is the default tier for
      mechanical work, however small the task is. Ideal for exploration that returns a short list
      of findings. Do not use when the answer needs interpretation, when a wrong result would be
      hard to notice, or when instructions are vague.
    invocation: |
      Set `assignment` to the complete assignment text. Run the CLI directly, without a wrapper
      agent or nested delegation, under a timeout:

          opencode run --agent plan --model opencode/deepseek-v4.1-flash-free --format json --archived "$assignment"

      Use `--agent build` instead of `plan` only when the assignment authorizes project writes or
      checks that write artifacts. Stay within the authorized paths. Do not pass `--auto`.
      Capture stdout and stderr. Check the exit status, JSON error events, and the final
      `step_finish` event before accepting the result.
      Capture its session ID, along with the provider/model and command, in the delegation record.
      If the `opencode` CLI is absent, skip this profile and record that.
      If the invocation fails or times out, record the diagnostic
      and fall back to the next suitable profile. Do not substitute a paid model or start a
      nested worker.

      Append the following report contract to `$assignment` so the delegate returns a
      small, complete report:

        REPORT FORMAT (mandatory): Answer in caveman voice — answer first, cut ceremony,
        drop articles where meaning survives, keep every technical fact. Code, commands,
        paths, numbers, and exact error strings stay verbatim. No greeting, no recap,
        no closer, no "Status: done" padding.
        Completeness floor: terseness never removes a required fact. If the task asked for
        every item, a complete enumeration, or an exact value, give every one of them.
        Report only what the assignment asked for: findings, evidence, and any blocker.

  - title: Fast
    model: [Haiku, Luna]
    priority: 15
    description: >
      Use for simple, low-risk work with a single verifiable answer and little judgment: locating
      files, finding where a symbol is defined, exact searches, listing usages, installing or
      downloading dependencies, running a build, test, or other command, extracting or reformatting
      data, summarizing a small input, and repetitive boilerplate. This is the default tier for
      mechanical work, however small the task is. Ideal for exploration that returns a short list
      of findings. Do not use when the answer needs interpretation, when a wrong result would be
      hard to notice, or when instructions are vague.
      Append the report contract to the assignment so the delegate returns a small, complete
      report; see the Report contract section in SKILL.md.

  - title: Focused
    model: [Sonnet, Terra]
    priority: 20
    description: >
      Use for well-scoped tasks with clear instructions and a defined outcome: implementing a
      specified change, writing tests, diagnosing a contained bug, documenting code, routine code
      review, and synthesizing several files into a conclusion. The assignment should state the
      goal, the boundaries, and how success is checked. Do not use when requirements are unclear or
      the work needs design decisions.
      Append the report contract to the assignment so the delegate returns a small, complete
      report; see the Report contract section in SKILL.md.

  - title: Deep
    model: [Opus, Sol]
    priority: 30
    description: >
      Use for difficult work that is ambiguous, cross-cutting, or needs sustained reasoning:
      designing architecture or data models, planning large refactors, investigating hard-to-
      reproduce failures, weighing tradeoffs, security analysis, and reviewing work other agents
      produced. Choose this when requirements must be inferred or when a shallow answer would cost
      more in rework than the stronger model costs.
      Append the report contract to the assignment so the delegate returns a small, complete
      report; see the Report contract section in SKILL.md.

  - title: Strongest
    model: [Fable]
    priority: 40
    description: >
      Use sparingly for the highest-stakes or hardest problems, where the Deep tier has failed or
      would plausibly miss subtle issues: critical design decisions that are costly to reverse,
      security-sensitive or irreversible changes, intricate multi-system debugging, and final
      verification of large efforts. Not for routine work; reserve it for questions where
      correctness matters more than cost or speed.
      Append the report contract to the assignment so the delegate returns a small, complete
      report; see the Report contract section in SKILL.md.

# Optional post-change stages. Uncomment either section to enable it. Both
# skills read these sections from this same file; no per-skill config is needed.
# Every parameter is optional, so `review: {}` and `qa: {}` are valid.
# review:
#   enabled: true
#   description: |
#     Review completed changes for correctness and regressions.
#     Include maintainability findings supported by evidence.
#   invocation: |
#     Invoke the configured reviewer with the completed diff.
#     Request prioritized findings with file references.
#
# qa:
#   enabled: true
#   description: |
#     Exercise changed behavior.
#     Verify every acceptance criterion independently.
#   invocation: |
#     Run the configured QA tool against the changed behavior.
#     Preserve commands, results, and failure evidence.
#
# Optional autonomous issue limits. The coordinator reads this section; defaults
# apply when it is absent or a key is omitted. `deadline` is ISO 8601.
# execution:
#   max_delegates: 3
#   max_correction_cycles: 3
#   deadline: 2026-11-26T18:00:00Z
#   delivery: merge-ready        # merge-ready or merged; merged needs explicit authorization
#   auto_merge: false
#   max_model_cost_usd: 20

# For complex invocation logic, reference a script instead of embedding many
# shell commands here. Explain its path, inputs, outputs, and failure behavior:
# review:
#   invocation: |
#     Run `.smart-delegate/scripts/review.sh` from the project root.
#     Pass the assignment on stdin. Read JSON findings from stdout.
#     A nonzero exit means the review could not complete; report stderr.
